# Claude Code as the agent under test: `cloakpipe prove --agent claude-code.agent.yaml`.
# It reaches the tools only through the gate prove starts (the `tools` server
# in $CLOAKPIPE_PROVE_MCP_CONFIG). Each run costs model tokens. Use the local
# sandbox (or an image with `claude` installed).
#
# --tools "" turns off the built-in tools (files, shell, web): the agent has
# only the MCP tools under test, and cannot read the pack's answers from disk.
# The prompt goes after `--`, or --allowedTools would take it as a tool name.
name: claude-code
command:
  - sh
  - -c
  - 'claude -p --tools "" --mcp-config "$CLOAKPIPE_PROVE_MCP_CONFIG" --strict-mcp-config --allowedTools "mcp__tools__*" -- "$CLOAKPIPE_PROVE_PROMPT"'
env:
  # A tool that never answers (the double-side-effect scenario) times out
  # after 20 s instead of holding the run until `timeout`.
  MCP_TOOL_TIMEOUT: "20000"
pass_env: [ANTHROPIC_API_KEY]
timeout: 300
