name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish to crates.io (e.g. v0.12.0)
        required: true

permissions:
  contents: write   # create the GitHub release
  packages: write   # push the image to GHCR

jobs:
  docker:
    name: Build & publish image (GHCR)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Static Linux binaries: they run in any sandbox image (`prove --sandbox
  # docker|e2b --cloakpipe-bin`), whatever its glibc.
  binaries:
    name: Static binary (${{ matrix.target }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p cloakpipe-cli --target ${{ matrix.target }}
      - name: Package
        run: |
          name=cloakpipe-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name" && cp target/${{ matrix.target }}/release/cloakpipe LICENSE* README.md "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cloakpipe-*.tar.gz*

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # The tag's code goes in src; the publish script comes from the
      # workflow's own commit, since an older tag may predate it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the token and the tag
        working-directory: src
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is not set; add it under Settings > Secrets > Actions."
            exit 1
          fi
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match the workspace version $version in Cargo.toml."
            exit 1
          fi
      - name: Publish
        working-directory: src
        run: ../tools/scripts/publish-crates.sh
